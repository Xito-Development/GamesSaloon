name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probar los juegos
        run: |
          npm install jsdom --no-save --silent
          node tests/test.js

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Copiar la web dentro de la app
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www

      - name: Compilar APK de depuración
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GamesSaloon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
